components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: masal_admin_session
      description: Browser-managed HttpOnly cookie issued only by the admin portal
    AgentsSession:
      type: apiKey
      in: cookie
      name: masal_agents_session
      description: Browser-managed HttpOnly cookie issued only by the agents portal
    PosSession:
      type: apiKey
      in: cookie
      name: masal_pos_session
      description: Browser-managed HttpOnly cookie issued only by the POS portal
  parameters:
    LocalPortal:
      name: X-Masal-Portal
      in: header
      required: false
      description: 'فقط عند التطوير/الاختبار على مضيف محلي مشترك. في الإنتاج لا يحدد

        هذا الحقل البوابة ولا يمنح وصولًا؛ يعتمد السيرفر المضيف المحدد في إعداداته.

        '
      schema:
        type: string
        enum:
        - admin
        - agents
        - pos
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: Client always sends the URL-decoded current host XSRF-TOKEN cookie; Laravel 13 uses
        token validation as fallback when same-origin verification does not pass
      schema:
        type: string
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MembershipId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttachmentId:
      name: attachment
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttachmentContentId:
      name: attachment
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Portal:
      type: string
      enum:
      - admin
      - agents
      - pos
    Account:
      type: object
      required:
      - id
      - name
      - type
      - parent_id
      - status
      - version
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 190
        type:
          type: string
          enum:
          - system
          - main_agent
          - sub_agent
          - sub_branch
          - pos
        parent_id:
          type: integer
          nullable: true
          description: POS may be directly under main_agent, sub_agent, or sub_branch. Creation selects
            a parent that the server validates against account type and actor scope; reparenting is unavailable.
        status:
          type: string
          enum:
          - active
          - disabled
        city:
          type: string
          maxLength: 80
          nullable: true
        phone:
          type: string
          pattern: ^[+0-9() -]+$
          maxLength: 30
          nullable: true
        support:
          type: string
          maxLength: 500
          nullable: true
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
          nullable: true
        owner_name:
          type: string
          maxLength: 190
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        serial:
          type: string
          maxLength: 190
          nullable: true
        device_model:
          type: string
          maxLength: 190
          nullable: true
        app_version:
          type: string
          maxLength: 190
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version; stale requests return 409.
        created_at:
          type: string
          format: date-time
          nullable: true
        parent:
          type: object
          properties:
            id:
              type: integer
              minimum: 1
            name:
              type: string
            type:
              type: string
              enum:
              - system
              - main_agent
              - sub_agent
              - sub_branch
              - pos
          required:
          - id
          - name
          - type
          nullable: true
          description: Only returned when the parent is inside the actor scope; never reveals an excluded
            ancestor.
        children_count:
          type: integer
          minimum: 0
        network_pos_count:
          type: integer
          minimum: 0
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
          maxItems: 100
          description: Present only when authorized to manage target account permissions; effective implemented
            keys.
        owner_user:
          $ref: '#/components/schemas/User'
          description: Conditionally authorized owner identity on detail/create/mutation resources; omitted
            from the account index.
        grantable_permissions:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Conditional on account.permissions in detail/mutation resources. Server-derived
            actor permissions intersected with target role ceiling and inherited/higher restrictions;
            UI options only, never authority input.
        profile_grantable_permissions:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Conditional on permission_profile.view or staff.create in detail/mutation resources.
            Actor permissions intersected with current account owner permissions for employee/profile
            assignment.
    User:
      type: object
      required:
      - id
      - name
      - login
      - email
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        login:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
      description: User identity always contains login and email properties; one can be null for a single
        identifier. No credentials are returned.
    IdentityResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - user
          - account
          - portal
          - permissions
          - membership
          properties:
            user:
              $ref: '#/components/schemas/User'
            account:
              $ref: '#/components/schemas/AccountCore'
            portal:
              $ref: '#/components/schemas/Portal'
            permissions:
              type: array
              items:
                type: string
              description: Effective implemented catalog keys, calculated from role/owner rules or employee
                profile intersected with the current owner ceiling and ancestor/authority restrictions.
                No financial/product permissions are implied.
              example:
              - account.create
              - account.view
            membership:
              $ref: '#/components/schemas/MembershipIdentity'
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      - parent_id
      - city
      - phone
      - user
      properties:
        _token:
          type: string
          writeOnly: true
          description: Optional Laravel transport CSRF token; this field is not passed into account creation,
            and the Vue client uses X-XSRF-TOKEN instead
        name:
          type: string
          minLength: 1
          maxLength: 190
        type:
          type: string
          enum:
          - main_agent
          - sub_agent
          - sub_branch
          - pos
        parent_id:
          type: integer
          minimum: 1
          description: Must identify a scoped, active parent compatible with the child type
        user:
          type: object
          additionalProperties: false
          required:
          - password
          - password_confirmation
          properties:
            name:
              type: string
              minLength: 1
              description: Optional; defaults to account.name.
              maxLength: 190
              nullable: true
            login:
              type: string
              minLength: 3
              description: Trimmed, lowercase username or valid email. ASCII usernames use 3..64 characters,
                begin with a letter and may contain digits, dot, underscore or hyphen. Email identifiers
                populate email and leave login null.
              maxLength: 190
              nullable: true
            email:
              type: string
              format: email
              description: Optional compatibility email or the identifier fallback; stored emails are
                accepted for login. Conflicting supplied email identifiers are rejected. The Vue creation
                form supplies one email identifier.
              maxLength: 190
              nullable: true
            password:
              type: string
              minLength: 12
              maxLength: 72
              writeOnly: true
              description: Requires letters and numbers; the server also enforces a maximum of 72 UTF-8
                bytes for bcrypt, which can be fewer than 72 characters
            password_confirmation:
              type: string
              writeOnly: true
              description: Must exactly match password, including the 72-byte limit
          anyOf:
          - required:
            - login
            properties:
              login:
                type: string
                nullable: false
                minLength: 3
          - required:
            - email
            properties:
              email:
                type: string
                nullable: false
                format: email
                minLength: 1
        city:
          type: string
          maxLength: 80
          nullable: false
          minLength: 1
        phone:
          type: string
          pattern: ^[+0-9() -]+$
          maxLength: 30
          nullable: false
          minLength: 1
        support:
          type: string
          maxLength: 500
          nullable: true
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
          nullable: true
        owner_name:
          type: string
          maxLength: 190
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        serial:
          type: string
          maxLength: 190
          nullable: true
        device_model:
          type: string
          maxLength: 190
          nullable: true
        app_version:
          type: string
          maxLength: 190
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
      description: The server checks parent scope and account type. Agents require name, city, phone and
        color; POS requires name, owner_name, city, address, phone, serial, device_model and app_version.
        Non-POS targets reject POS-only fields. Active governorate and unique normalized serial are checked.
        Product assignment and registration controls remain pending.
      oneOf:
      - properties:
          type:
            type: string
            enum:
            - main_agent
            - sub_agent
            - sub_branch
          color:
            type: string
            nullable: false
            minLength: 1
        required:
        - color
        not:
          anyOf:
          - required:
            - owner_name
          - required:
            - address
          - required:
            - serial
          - required:
            - device_model
          - required:
            - app_version
      - properties:
          type:
            type: string
            enum:
            - pos
          owner_name:
            type: string
            nullable: false
            minLength: 1
          address:
            type: string
