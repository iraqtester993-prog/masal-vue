  responses:
    Unauthenticated:
      description: Missing, expired, or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Unknown host, portal mismatch, disabled session account chain, or insufficient permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfFailure:
      description: Origin verification did not pass and CSRF token is missing or invalid; initialize a
        fresh CSRF session before retrying login
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailure:
      description: Invalid input or generic rejected login; no account existence or portal reason is revealed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: Account does not exist or is outside the authenticated account scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Login attempt rate limit reached
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another attempt may be allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Stale optimistic version, or a linked permission profile that cannot be deleted. No
        requested mutation is committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
