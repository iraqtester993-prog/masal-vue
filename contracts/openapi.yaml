openapi: 3.0.3
info:
  title: Masal — isolated portals and implemented v1 system API
  version: 0.7.0
  description: |
    Source snapshot 07 includes the implemented Laravel v1 modules listed below.
    This document retains the 35 paths / 45 detailed operations originally described
    in the 0.3 accounts/catalog contract. Those detailed schemas are a limited baseline,
    not complete request/response coverage for snapshot 07. Subsequent implementation
    behavior is authoritative in each current FormRequest, controller, resource and service.
    API_ROUTE_CATALOG.json is generated from the current Laravel route:list --json output;
    it lists all 214 registered api/v1 and Sanctum CSRF method/path records (180 unique
    URI paths; GET records also include HEAD). The catalog proves registered path coverage,
    not permissions, business correctness, external-provider readiness or production deployment.
    Validation status and remaining native/deployment work are recorded in
    ../docs/FULL_SYSTEM_07_VERIFICATION.md. Production is still release 06b at this draft.
servers:
- url: https://admin.dananir-iq.com
  description: Final System administration portal; same-origin cookie session and /api/v1 paths
- url: https://agents.dananir-iq.com
  description: Final main-agent, sub-agent and sub-branch portal; same-origin /api/v1 paths
- url: https://pos.dananir-iq.com
  description: Final point-of-sale portal; same-origin /api/v1 paths
- url: /
  description: Current origin in local development or a correctly configured final portal
x-route-catalog:
  file: API_ROUTE_CATALOG.json
  generator: scripts/backend.ps1 artisan route:list --json
  scope:
  - api/v1/*
  - sanctum/csrf-cookie
  records: 214
  unique-uri-paths: 180
  sha256: 8208296d212b4c285906ebd7c98076afdbdd79e51ae4a66acade14fe5dd7b2f3
  coverage: Complete registered route inventory; request and response schemas are not inferred
x-detailed-schema-coverage:
  baseline-version: 0.3.0
  paths: 35
  operations: 45
  status: Limited historical accounts, session, staff, permission-profile and catalog baseline
x-implemented-source-modules:
- Sessions and authentication
- Accounts, hierarchy, staff, permission profiles and attachments
- Catalog providers, categories and scoped availability
- Reference governorates and point-of-sale types
- Finance wallets, ledger, funding, prices, transfers, recoveries and invoices
- Stock import, inventory, exports and damaged-card claims
- Sales, reservations, printing, reprint requests, exceptions and print policies
- Support conversations and notification audiences
- Reports and dashboard summaries
- Digital provider connections, offers, grants, orders, verification and receipts
- User presence and consent-controlled maps
- Operation stops, account archive and account time policies
- Company settings, private/public assets and persisted public enquiries
- Signed encrypted server backups, restore preview and guarded scratch-database restore
- Server-persisted user interface preferences
tags:
- name: Session
  description: Cookie session and CSRF initialization
- name: Accounts
  description: Account reads and subordinate creation restricted by permission and account tree
- name: Staff
- name: PermissionProfiles
- name: Options
- name: Attachments
- name: Catalog
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
      - Session
      operationId: initializeCsrf
      summary: تهيئة جلسة وCSRF للبوابة الحالية
      description: 'الاستجابة لا تحتوي بيانات هوية. Set-Cookie يرسل كوكي الجلسة الخاص

        بالبوابة وXSRF-TOKEN الخاص بالمضيف. لا Domain wildcard بين البوابات.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      responses:
        '204':
          description: Session and CSRF cookies initialized; no response body
          headers:
            Set-Cookie:
              description: Browser-managed host-only session and XSRF cookies; may appear more than once
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/login:
    post:
      tags:
      - Session
      operationId: login
      summary: الدخول إلى بوابة الحساب المسموحة
      description: 'ينشئ جلسة مصادقًا عليها ويجدد معرفها. بيانات الدخول غير الصحيحة

        أو حساب بوابة أخرى أو حساب/عضوية/سلسلة حسابات معطلة تنتج خطأ 422

        عامًا دون كشف سبب يتعلق بهوية مستخدم معين. لا يسمح العميل بتحديد

        دور أو account_id أو portal داخل الجسم لمنح نفسه صلاحية.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 190
                  description: Username without @ or registered email; server trims and lowercases it
                    and selects the matching field unambiguously
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
            example:
              login: account-user
              password: YOUR_PRIVATE_PASSWORD
      responses:
        '200':
          description: Authenticated session and allowed portal identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '419':
          $ref: '#/components/responses/CsrfFailure'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/me:
    get:
      tags:
      - Session
      operationId: currentIdentity
      summary: هوية المستخدم والحساب والصلاحيات الفعلية
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      responses:
        '200':
          description: Valid current session, membership, portal, and active account ancestry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      tags:
      - Session
      operationId: logout
      summary: إلغاء جلسة البوابة الحالية
      description: A correctly portal-bound authenticated session may log out even if the user or account
        is disabled; the frontend clears its in-memory identity and account results
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      responses:
        '204':
          description: Session invalidated; no response body
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/accounts:
    post:
      tags:
      - Accounts
      operationId: createAccount
      summary: إنشاء حساب تابع ومستخدمه الأول داخل النطاق
      description: 'يتطلب account.create. يختار العميل parent_id، لكن السيرفر يتحقق أن

        الأب هو حساب المنفذ أو تابع فعلي داخل نطاقه، أو ضمن نطاق مدير النظام.

        النوع يطابق الأب المختار: system ينشئ main_agent، وmain_agent ينشئ

        sub_agent أو pos، وsub_agent ينشئ sub_branch أو pos، وsub_branch

        ينشئ pos. الرئيسي يستطيع إنشاء فرع فرعي تحت فرعي تابع له، لكنه لا

        ينشئه مباشرة تحت نفسه. نقطة البيع لا تملك إنشاء حساب تابع.

        إنشاء الحساب وعلاقات الشجرة والمستخدم والعضوية والتدقيق داخل معاملة

        واحدة. يحدد السيرفر الدور والصلاحيات والحالة؛ ترفض حقول رفع الامتياز

        أو أي حقول إضافية. لا يسمح هذا المسار بنقل تبعية أو منح صلاحيات مخصصة.


        Creation requires owner membership in addition to account.create; employee membership cannot create
        commercial accounts in this phase.'
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      security:
      - AdminSession: []
      - AgentsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Active subordinate account and its first user created, without secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Selected parent is absent or outside the actor's account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '419':
          $ref: '#/components/responses/CsrfFailure'
        '422':
          $ref: '#/components/responses/ValidationFailure'
    get:
      tags:
      - Accounts
      operationId: listAccounts
      summary: قائمة حسابات ضمن نطاق المستخدم
      description: 'يتطلب account.view. الوكيل يرى نفسه وتابعيه داخل شبكته؛ نقطة البيع

        ترى نفسها. لا يوجد اختيار account_id لرفع نطاق المستخدم. الصفحة

        والمجموع يحسبان بعد تطبيق النطاق. لا تتضمن الاستجابة كلمات مرور

        أو أرصدة أو رموز بطاقات أو صلاحيات حقول غير منفذة.


        meta.summary counts main_agent/sub_agent/sub_branch/pos inside actor scope before optional filters;
        all returned rows remain scoped.'
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Requested page number; defaults to the first page
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Requested page size, limited by the server
      - name: q
        in: query
        schema:
          type: string
          maxLength: 190
        description: Searches scoped row name, phone, serial, city, owner_name and the name of a parent
          visible in actor scope. Representatives remain unimplemented.
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - agents
          - pos
        description: Portal listing category; does not expand account scope.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - system
          - main_agent
          - sub_agent
          - sub_branch
          - pos
        description: Exact account type.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - disabled
        description: Exact account status.
      - name: city
        in: query
        schema:
          type: string
          maxLength: 80
        description: Governorate filter.
      - name: parent_id
        in: query
        schema:
          type: integer
          minimum: 1
        description: Direct parent filter applied after actor scope.
      - name: ancestor_id
        in: query
        description: Restricts rows to the selected account and its descendants, always intersected with
          actor scope. An unscoped ancestor cannot widen results.
        schema:
          type: integer
          minimum: 1
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      responses:
        '200':
          description: Scoped paginated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /api/v1/accounts/{id}:
    get:
      tags:
      - Accounts
      operationId: showAccount
      summary: تفاصيل حساب ضمن النطاق
      description: يتطلب account.view؛ الحساب خارج النطاق يعامل كغير موجود ويعيد 404
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      responses:
        '200':
          description: Scoped account
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Accounts
      operationId: updateAccount
      summary: تعديل بيانات الحساب
      description: Requires account.update and scoped target. Type, parent, status, password, grants and
        login cannot change here. POS device/location fields need their additional permission. System/self
        mutation is protected.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
    parameters:
    - $ref: '#/components/parameters/AccountId'
  /api/v1/accounts/{id}/status:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    patch:
      tags:
      - Accounts
      operationId: setAccountStatus
      summary: إيقاف أو تفعيل حساب
      description: Requires account.toggle and scoped target. Protects current/system account. Independent
        descendant stops remain; old sessions are revoked on disable.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/accounts/{id}/login:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    patch:
      tags:
      - Accounts
      operationId: updateAccountLogin
      summary: تعديل معرف دخول تابع
      description: Requires System account, owner membership and account.login. Scoped descendant owner
        identifier changes independently of business fields. Self/System email editing and password reset
        remain pending.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLoginPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/accounts/{id}/permissions:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    patch:
      tags:
      - Accounts
      operationId: setAccountPermissions
      summary: تعديل صلاحيات التابع
      description: 'Requires account.permissions, scoped descendant and reason. permissions is the desired
        effective implemented key set. Server owns authority and grant boundaries; lower decisions cannot
        erase a higher target restriction. No financial keys or arbitrary authority payload.

        The server compares the desired set with current effective keys. A higher explicit change to the
        same target/key can replace lower decisions; restoring an ancestor account does not erase an independent
        child deny.

        Unchanged existing keys may be retained even when the actor cannot delegate them. Every added
        or removed key must be within actor authority; only added keys are checked against target role
        and inherited limits. Empty desired sets are allowed subject to those change checks.'
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPermissionsPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/account-options:
    parameters: []
    get:
      tags:
      - Options
      operationId: accountOptions
      summary: خيارات الحسابات
      description: Authoritative active governorate names; management of governorates is outside this
        phase.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOptions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /api/v1/permission-catalog:
    parameters: []
    get:
      tags:
      - PermissionProfiles
      operationId: permissionCatalog
      summary: كتالوج الصلاحيات المنفذة
      description: Only keys backed by implemented server policies; unimplemented financial and product
        permissions are not selectable.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /api/v1/accounts/{id}/staff:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      tags:
      - Staff
      operationId: listStaff
      summary: موظفو الحساب
      description: Requires staff.view; both employer account and each membership scope must be authorized.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
    post:
      tags:
      - Staff
      operationId: createStaff
      summary: إضافة موظف
      description: Requires staff.create. Employer derives from the scoped route; kind employee is server-selected.
        Active profile, nonempty roots and capability ceilings are enforced.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/accounts/{id}/staff/{memberId}:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    - $ref: '#/components/parameters/MembershipId'
    patch:
      tags:
      - Staff
      operationId: updateStaff
      summary: تعديل موظف
      description: Requires staff.update. Profile and scope changes additionally require staff.role/staff.scope.
        Owner/self privilege edits are protected; login/password/employer/kind cannot be smuggled in.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          $ref: '#/components/responses/CsrfFailure'
  /api/v1/accounts/{id}/staff/{memberId}/status:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    - $ref: '#/components/parameters/MembershipId'
    patch:
      tags:
      - Staff
      operationId: setStaffStatus
      summary: إيقاف أو تفعيل موظف
      description: Requires staff.toggle and valid version/reason. Self and protected owners cannot be
        disabled by this route; revoked sessions do not revive on enable.
      security:
      - AdminSession: []
      - AgentsSession: []
      - PosSession: []
      parameters:
      - $ref: '#/components/parameters/LocalPortal'
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusPatch'
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '401':
